[project]
name = "yandex-music-playlist-backup"
version = "0.1.0"
description = "CLI to snapshot and version a Yandex Music user's liked tracks"
license = "GPL-3.0-or-later"
authors = [
    {name = "Simon",email = "spam@esemi.ru"}
]
readme = "README.md"
requires-python = "~=3.14"
dependencies = [
    "yandex-music[async] (>=3.0.0,<4.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "yt-dlp[default] (>=2026.7.4,<2027.0.0)",
]

[dependency-groups]
dev = [
    "ruff (>=0.16.0,<1.0.0)",
    "mypy (>=1.11.0,<3.0.0)",
    "vulture (>=2.14,<3.0.0)",
    "pytest (>=8.0.0,<10.0.0)",
    "pytest-mock (>=3.14.0,<4.0.0)",
    "pytest-asyncio (>=0.24.0,<2.0.0)",
    "pytest-cov (>=5.0.0,<8.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "LOG", "RUF"]

[tool.mypy]
python_version = "3.14"
files = ["app"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yandex_music.*", "yt_dlp.*"]
ignore_missing_imports = true

[tool.vulture]
paths = ["app"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"
